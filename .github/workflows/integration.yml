name: Integration

# tests/integration/ is a real cross-service suite (gateway routing,
# security headers, rate limiting, cross-service auth/JWT flows) that only
# passes against the full stack — nginx + all 7 Django services + Postgres +
# Redis + MinIO + ClamAV, exactly as documented in tests/integration/conftest.py.
# That is fundamentally different from ci.yml's backend-tests, which run
# each service in isolation against sqlite/LocMemCache with zero external
# dependencies by design.
#
# Deliberately NOT part of ci.yml / NOT a required check / NOT triggered on
# pull_request. Booting this stack takes several minutes (ClamAV alone can
# take up to 5 minutes to pull its signature database on first boot — see
# infra/docker-compose.dev.yml) and multi-container boots on a shared,
# single-run CI host are a known source of flakiness unrelated to code
# correctness (port timing, cold image pulls, health-check races). Gating
# every PR on that trades a fast, trustworthy required check for a slow,
# occasionally-flaky one — the standard failure mode that trains people to
# blindly re-run red checks instead of trusting them.
#
# So this runs where a full-stack smoke/integration suite belongs: right
# after a merge lands on main (fast enough to catch and revert a real
# cross-service regression) and on demand via workflow_dispatch (e.g.
# before a release, or to re-verify after an infra change). A failure here
# does not block anything automatically — it surfaces as a failed run on
# main for a human to act on.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Compose already defaults the project name to "infra" here — it's
      # the basename of the directory containing docker-compose.dev.yml,
      # not the invoking working directory, so this holds regardless of
      # where in the repo `docker compose` is actually run from (verified:
      # even invoking from an unrelated directory outside the repo entirely
      # still resolves to "infra"). Pinned explicitly anyway, since
      # tests/integration/ hardcodes infra-postgres-1, infra-auth-service-1,
      # infra-db-backup-1, infra-pgbouncer-1 for its `docker exec` calls
      # (real network/auth tests that can't just hit a host-published port
      # — see those test files' own docstrings), and that's too much to
      # leave resting on an implicit Compose naming rule nobody would think
      # to check if this workflow's invocation ever changed shape.
      COMPOSE_PROJECT_NAME: infra
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose -f infra/docker-compose.dev.yml up --build -d

      # Polls the same health endpoint tests/integration/conftest.py checks
      # before running any test, just with a much longer window (10 min) to
      # cover a cold `--build` plus Postgres/MinIO/ClamAV first-boot time —
      # conftest.py's own 3-attempt/6-second retry is tuned for an
      # already-warm local stack, not a from-scratch CI boot.
      - name: Wait for the gateway to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/api/auth/health/ > /dev/null; then
              echo "Gateway is up after ${i} attempt(s)."
              exit 0
            fi
            echo "Waiting for gateway... (${i}/60)"
            sleep 10
          done
          echo "Gateway never became healthy — dumping state for diagnosis."
          docker compose -f infra/docker-compose.dev.yml ps
          docker compose -f infra/docker-compose.dev.yml logs --tail=200
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Run integration suite
        run: pytest tests/integration/ -v

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml down -v
