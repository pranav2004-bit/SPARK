worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip compression (T10) ─────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;

    # ── Rate limiting zones (T9) ───────────────────────────────────────────────
    # Tighter than nginx.dev.conf on purpose — dev keeps looser limits so
    # local testing/integration tests aren't flaky, prod gets the real
    # production-safe numbers.
    #
    # auth_zone/token_refresh_zone/api_zone sizing (revised — capacity audit,
    # 2026-11-15, user-stated requirement: up to 2000 concurrent students,
    # continuously active for multiple hours, who may all share a SINGLE
    # public IP — e.g. one entire campus network/NAT during a proctored
    # exam, not just one exam hall). These three zones are the ones real
    # legitimate traffic from that many students behind one IP would
    # actually pass through; sensitive_zone/export_zone are not (see their
    # own comments below) and are deliberately left alone.
    #
    # These IP-keyed zones are NOT the credential-brute-force defense and
    # were never meant to be — that job belongs to the per-ACCOUNT throttle
    # (auth-service/authentication/throttling.py's LoginAttemptThrottle,
    # 5/min keyed on the submitted student_id, completely independent of
    # IP) and is untouched by any of this. Collapsing IP-based limiting in
    # favor of pure per-account limiting was considered and rejected: an
    # attacker trying ONE password each against many DIFFERENT accounts
    # (password spraying / credential stuffing) gets a fresh, untouched
    # per-account counter on every attempt — only an IP-level cap catches
    # that shape of abuse. So both layers stay; only the IP-level ceiling
    # changes, from "sized for one person" to "sized for one legitimate
    # 2000-student cohort sharing a NAT gateway."
    #
    # auth endpoints: 3000 req/min per IP — covers 2000 students submitting
    # login within the same tight, synchronized window (exam start) plus a
    # generous allowance for mistyped-password retries, while still being a
    # real, meaningful ceiling against a single script/bot hammering this
    # endpoint (which has no legitimate reason to ever approach this rate
    # from one source). burst=150 (set per-location below) absorbs a
    # same-second click wave without delaying any legitimate request.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=3000r/m;
    # token refresh: same campus-IP-scale ceiling as auth_zone, for the same
    # underlying reason, discovered in the same audit. Originally raised
    # (2026-09-12 fix, see git history) only as far as "well above any real
    # per-IP exam-hall headcount" — i.e. sized for one classroom/lab, not an
    # entire 2000-student campus network. Access tokens live 15 min
    # (auth-service/core/settings.py SIMPLE_JWT), so a synchronized exam
    # start produces a synchronized *refresh* burst of the same shape and
    # scale as the original login burst, ~15 minutes later — this zone
    # needed the identical fix as auth_zone, not a smaller one. A refresh
    # token still isn't a guessable secret (brute-force still isn't the
    # threat model here) — this exists purely to keep pace with legitimate
    # concurrent exam traffic.
    limit_req_zone $binary_remote_addr zone=token_refresh_zone:10m rate=3000r/m;
    # password reset/change endpoints: 5 req/min — same rationale as
    # auth_zone but its own bucket, so reset-spam and login-brute-force
    # don't share (and can't starve each other's) allowance. NOT raised in
    # this audit — password reset/change is not part of the 2000-concurrent-
    # student login/exam path (students aren't mass-resetting passwords at
    # exam start), so loosening it would only reduce its real security
    # value with no actual capacity benefit.
    limit_req_zone $binary_remote_addr zone=sensitive_zone:10m rate=5r/m;
    # all other API endpoints: 20000 req/min per IP — covers 2000 students
    # in continuous, concurrent use for multiple hours (status polling,
    # question/content fetches, answer autosaves, etc.) from one shared IP,
    # with substantial headroom over realistic sustained per-student usage.
    # The real per-account ceiling here is DRF's own per-user throttle
    # (300/min per authenticated student, every service's
    # core/settings.py DEFAULT_THROTTLE_RATES) — untouched by this change.
    # This zone's actual remaining job is catching a single pathological
    # client/script monopolizing the gateway, not gating legitimate
    # aggregate traffic from a shared campus network.
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=20000r/m;
    # assessment-service export endpoints specifically (results/analytics/
    # dashboard CSV export): large, infrequent, expensive requests, a
    # different shape than the frequent cheap admin GETs sharing api_zone
    # with them — see nginx.dev.conf's matching zone for the full
    # rationale. Kept at the same 10r/m in prod as dev (unlike auth_zone/
    # api_zone above, which loosen in dev for testing convenience): there's
    # no legitimate high-frequency workflow, dev or prod, that needs an
    # admin to export more often than this — same reasoning sensitive_zone
    # already uses to justify staying identical in both files.
    limit_req_zone $binary_remote_addr zone=export_zone:10m rate=10r/m;
    # essay-service: Task 15.2 (bot/automation defense) closing a gap this
    # file's own comment had been carrying since Phase 1 — ADR 004 Section
    # 4 already decided these exact three zones/rates before any of the
    # routes existed; only now do autosave/submit/admin-bulk-action
    # routes actually exist to attach them to.
    #
    # essay_autosave_zone and essay_submit_zone raised in the same
    # 2026-11-15 capacity audit as auth_zone/token_refresh_zone/api_zone
    # above — these two are squarely in the "2000 students writing an
    # essay exam for hours, possibly behind one shared campus IP" path and
    # were missed in the first pass of that audit (found on a deliberate
    # re-check, not assumed fixed just because the other three were).
    # essay_admin_bulk_zone is NOT touched — it's an admin-only bulk-action
    # endpoint (retrigger/bulk-resend/bulk-DLQ-retry), never called by
    # students, so it's outside the 2000-concurrent-student scenario
    # entirely, same reasoning as export_zone/sensitive_zone above.
    #
    # autosave: 120 -> 75000 r/m. Grounded in the real client behavior, not
    # a guess: the essay editor's own debounce (AUTOSAVE_DEBOUNCE_MS=2000,
    # frontend/src/app/students/essay-writing/[assignment_id]/page.tsx)
    # means the true legitimate ceiling is 30 saves/min PER STUDENT (60s /
    # 2s) — already confirmed and documented as sound against the old
    # 120r/m ceiling (LIVETRACKER3_V1.md Phase 15's third audit: "30/min,
    # comfortably under the 120r/m ceiling with 4x headroom"). That
    # per-student math doesn't change here — only the aggregate IP-level
    # ceiling does: 2000 students all saving at that real maximum cadence
    # simultaneously is a genuine theoretical worst case of 2000 x 30 =
    # 60000/min, so 75000r/m is headroom ABOVE that true ceiling, not a
    # guess sized below it. The real per-account ceiling remains essay-
    # service's own EssayAutosaveRateThrottle (120/min PER STUDENT,
    # essays/throttling.py) — untouched; that number was never the
    # problem, this IP-level one was.
    limit_req_zone $binary_remote_addr zone=essay_autosave_zone:10m rate=75000r/m;
    # submit: 10 -> 3000 r/m, same reasoning and same number as auth_zone —
    # a hard exam deadline is exactly the kind of synchronized-burst event
    # login is: students commonly submit in a tight window right before
    # time runs out, not spread evenly across the exam. The real per-
    # account ceiling remains essay-service's own EssaySubmitRateThrottle
    # (10/min PER STUDENT, fail-closed on purpose per ADR 003 Decision 8 —
    # see that class's own docstring; deliberately NOT touched here, this
    # is a different, unrelated cost-control decision, not a shared-IP
    # capacity issue).
    limit_req_zone $binary_remote_addr zone=essay_submit_zone:10m rate=3000r/m;
    limit_req_zone $binary_remote_addr zone=essay_admin_bulk_zone:10m rate=10r/m;
    limit_req_status 429;

    # ── Retry-After (matches the zone each URI actually falls into) ───────────
    # Prod rates: auth_zone/token_refresh_zone=3000r/m, api_zone=20000r/m,
    # essay_autosave_zone=75000r/m, essay_submit_zone=3000r/m (all "1" is
    # the sane floor) — all five raised in the 2026-11-15 capacity audit,
    # see their zone definitions above. sensitive_zone=5r/m (12s/req) and
    # export_zone/essay_admin_bulk_zone=10r/m (6s/req) are unchanged —
    # deliberately out of scope for that audit (admin-only / not part of
    # the 2000-concurrent-student path).
    map $uri $retry_after {
        ~^/api/auth/token/refresh/             "1";
        ~^/api/auth/(login|logout|token)/     "1";
        ~^/api/auth/.*password                "12";
        ~^/api/assessments/admin/.*/export/$  "6";
        ~^/api/essay/student/attempts/[^/]+/submit/$  "1";
        ~^/api/essay/admin/(submissions/[^/]+/retrigger|assignments/[^/]+/reports/bulk-(resend|download)|dlq/bulk-retry)/$  "6";
        default                               "1";
    }

    # ── Access logging ─────────────────────────────────────────────────────────
    # Suppress health/ready check noise from access logs
    map $request_uri $loggable {
        ~^/api/[^/]+/health/  0;
        ~^/api/[^/]+/ready/   0;
        default               1;
    }

    log_format json_access escape=json
        '{"time":"$time_iso8601",'
         '"method":"$request_method",'
         '"uri":"$request_uri",'
         '"status":$status,'
         '"body_bytes_sent":$body_bytes_sent,'
         '"request_time":$request_time,'
         '"remote_addr":"$remote_addr",'
         '"request_id":"$request_id",'
         '"upstream_addr":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json_access if=$loggable;

    # ── Docker DNS resolver ────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── WebSocket upgrade mapping ─────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ── CORS allowed origin (2026-09-12) ──────────────────────────────────────
    # Frontend (Vercel) and this gateway (AWS) became different browser
    # origins the moment compute moved off a single dev host — in
    # nginx.dev.conf, $frontend_backend is proxied through this SAME nginx,
    # so the browser has only ever seen one origin locally and CORS was
    # never needed there. Production has no such proxy for the frontend
    # (it's served by Vercel directly), so without this, every API call from
    # the deployed frontend is blocked by the browser before it even reaches
    # this server.
    #
    # Only origins matched here get their own Origin echoed back via
    # $cors_origin below; anything else gets "" and the browser then blocks
    # the response client-side (fails closed, not open to any origin).
    map $http_origin $cors_origin {
        default "";
        # Real production frontend domain (2026-09-12) — decided as
        # spark.sanjivo.com, deployed on Vercel with this custom domain
        # attached. If a Vercel preview/staging URL is ever needed too, add
        # it as its own line here rather than loosening this regex.
        "~^https://spark\.sanjivo\.com$" $http_origin;
    }

    # ── Backend hostnames ──────────────────────────────────────────────────────
    # Deliberately NOT static `upstream{}` blocks. Open-source nginx resolves
    # an upstream{} block's server list once, at config load, and caches it
    # for the life of the worker process — if a backend container gets
    # recreated (new IP), nginx keeps sending traffic to the dead IP until
    # someone runs `nginx -s reload`, producing a 502 outage in the meantime.
    # Using a variable in proxy_pass instead forces nginx to re-resolve via
    # the `resolver` directive above on every request (bounded by its `valid`
    # TTL), so a recreated container is picked up automatically. Trade-off:
    # this loses upstream-block connection keepalive pooling — each request
    # gets a fresh TCP connection to the backend. Acceptable here: backends
    # are on the same low-latency Docker bridge network, not the public
    # internet, so the extra handshake cost is negligible next to correctness.
    map $host $auth_backend         { default auth-service:8000; }
    map $host $user_backend         { default user-service:8000; }
    map $host $resource_backend     { default resource-service:8000; }
    map $host $practice_backend     { default practice-service:8000; }
    map $host $notification_backend { default notification-service:8000; }
    map $host $analytics_backend    { default analytics-service:8000; }
    map $host $assessment_backend   { default assessment-service:8000; }
    map $host $essay_backend        { default essay-service:8000; }

    # MinIO CORS proxy (port 9002) removed 2026-09-11 — media storage now
    # points at real AWS S3, which has its own CORS support directly on the
    # bucket and a real, stable public endpoint reachable from both the
    # browser and this server, so the whole reason this proxy existed
    # (MinIO has neither) no longer applies. See PRODUCTION_CHECKLIST.md's
    # "Items Added During Development" for the full migration record.

    # ── HTTP (port 80): ACME challenge + redirect everything else to HTTPS ─────
    server {
        listen 80;
        server_name api.spark.sanjivo.com;

        # Let's Encrypt HTTP-01 domain-ownership challenge. Must stay plain
        # HTTP and reachable before any cert exists yet (initial issuance)
        # and after (every 60-day renewal) — served straight from the
        # webroot certbot itself writes to, no proxy/backend involved.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Plain-HTTP healthcheck target for Docker's own healthcheck (wget
        # in nginx:alpine has no HTTPS support) — everything else on port 80
        # still redirects to HTTPS. Not proxied to a backend, just proves
        # nginx itself is alive.
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main server (port 443, HTTPS) ──────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.spark.sanjivo.com;

        ssl_certificate     /etc/letsencrypt/live/api.spark.sanjivo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.spark.sanjivo.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers on all responses
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;

        # ── CORS (see $cors_origin's definition above for the full story) ────────
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

        # Preflight — browsers send a real OPTIONS request before any
        # cross-origin GET/POST/etc. carrying custom headers (Authorization
        # included), and expect a 204 with the headers above, not a
        # forwarded request — none of the 7 Django services implement their
        # own OPTIONS handler, so answer it here, once, before it ever
        # reaches a backend or a rate-limit bucket.
        #
        # A bare `if ($request_method = OPTIONS) { return 204; }` directly
        # in server context does NOT reliably short-circuit before a
        # location's own proxy_pass — confirmed live in nginx.dev.conf
        # (2026-09-15): OPTIONS requests to even the simplest location
        # (/api/auth/health/, no overrides) still proxied straight through
        # to Django instead of getting nginx's 204, meaning this exact
        # pattern likely never actually answered a real cross-origin
        # preflight from the production Vercel frontend either. Using the
        # same error_page redirect trick already proven working in this
        # file for the 429 rate-limit handler below, instead of the
        # unreliable bare `if`.
        if ($request_method = OPTIONS) {
            return 418;
        }
        error_page 418 = @cors_preflight;
        location @cors_preflight {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Content-Length' 0;
            return 204;
        }

        # Max upload size enforced at gateway (resource/practice presigned uploads)
        client_max_body_size 50M;

        # Custom 429 JSON body — overrides nginx default HTML error page.
        # Retry-After header now actually set (was previously only in the
        # JSON body, which HTTP clients/proxies don't parse automatically).
        error_page 429 @rate_limit_error;
        location @rate_limit_error {
            default_type application/json;
            add_header Retry-After $retry_after always;
            # nginx's add_header inheritance is all-or-nothing per location:
            # since this block already defines its own add_header (above),
            # it does NOT inherit the CORS headers set at server level, and
            # must repeat them explicitly. Without this, a cross-origin 429
            # (e.g. the token-refresh rate limit) arrives at the browser with
            # no Access-Control-Allow-Origin — CORS itself blocks it before
            # the frontend's retry-on-429 handling ever sees the real
            # response, turning a soft, retryable 429 into an opaque network
            # error for any request originating from the Vercel frontend.
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            return 429 '{"error":"Rate limit exceeded","retry_after":"$retry_after"}';
        }

        # ── Health / ready probes — NO rate limiting ──────────────────────────
        # These are called by load balancers, Docker health checks, and monitoring
        # tools at high frequency. They must never be rate-limited.
        # More-specific prefix locations take precedence over the general blocks below.
        location /api/auth/health/          { proxy_pass http://$auth_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/auth/ready/           { proxy_pass http://$auth_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/users/health/         { proxy_pass http://$user_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/users/ready/          { proxy_pass http://$user_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/resources/health/     { proxy_pass http://$resource_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/resources/ready/      { proxy_pass http://$resource_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/practice/health/      { proxy_pass http://$practice_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/practice/ready/       { proxy_pass http://$practice_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/notifications/health/ { proxy_pass http://$notification_backend; include /etc/nginx/proxy_params.conf; }
        location /api/notifications/ready/  { proxy_pass http://$notification_backend; include /etc/nginx/proxy_params.conf; }
        location /api/analytics/health/     { proxy_pass http://$analytics_backend;    include /etc/nginx/proxy_params.conf; }
        location /api/analytics/ready/      { proxy_pass http://$analytics_backend;    include /etc/nginx/proxy_params.conf; }
        location /api/assessments/health/   { proxy_pass http://$assessment_backend;   include /etc/nginx/proxy_params.conf; }
        location /api/assessments/ready/    { proxy_pass http://$assessment_backend;   include /etc/nginx/proxy_params.conf; }
        # essay-service has no separate /ready/ endpoint (its HealthView
        # already reports DB+Redis reachability in one response) — only
        # reserving what actually exists, not a speculative route pointing
        # at nothing (see assessment-service's own .../ready/ above, which
        # is reserved here but not backed by any Django route yet).
        location /api/essay/health/         { proxy_pass http://$essay_backend;         include /etc/nginx/proxy_params.conf; }

        # ── auth-service: block internal endpoints from external access ───────────
        location /api/auth/internal/ {
            return 404;
        }

        # ── notification-service: block internal endpoints from external access ──
        location /api/notifications/internal/ {
            return 404;
        }

        # ── analytics-service: block internal endpoints from external access ─────
        location /api/analytics/internal/ {
            return 404;
        }

        # ── assessment-service: block internal endpoints from external access ────
        # No internal endpoints exist yet in V1 (docs/assessment-service-api.md,
        # Decision #6) — this block is reserved per the platform convention in
        # case a future phase adds one, starting as a blanket 404.
        location /api/assessments/internal/ {
            return 404;
        }

        # ── essay-service: block internal endpoints from external access ─────────
        # No internal endpoints exist yet (Phase 1 scaffolding only) — reserved
        # per the platform convention in case a later phase adds one.
        location /api/essay/internal/ {
            return 404;
        }

        # ── auth-service: token refresh (separate, generous rate limit) ──────────
        # Split out from auth_zone (2026-09-12) — see token_refresh_zone's
        # definition above for the full rationale. burst=60 absorbs a
        # synchronized wave of refreshes when many students' access tokens
        # (15-min lifetime) expire in the same window, e.g. near exam start.
        # Declared before the more general /api/auth/token/ block below —
        # nginx picks the longest matching prefix regardless of declaration
        # order, so this one wins for refresh requests specifically.
        location /api/auth/token/refresh/   { limit_req zone=token_refresh_zone burst=300 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }

        # ── auth-service: login + token endpoints (tight rate limit) ─────────────
        # 5 req/min — brute-force protection for credential endpoints only.
        location /api/auth/login/           { limit_req zone=auth_zone burst=150 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }
        location /api/auth/logout/          { limit_req zone=auth_zone burst=150 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }
        location /api/auth/token/           { limit_req zone=auth_zone burst=150 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }

        # ── auth-service: password reset/change endpoints (tightest rate limit) ──
        # 5 req/min — matches student/admin reset-password, change-password,
        # reset-default-password, admin-password-reset. Regex on "password"
        # in the path rather than enumerating each route: covers
        # /api/auth/me/change-password/, /api/auth/student/<id>/reset-password/,
        # /api/auth/admin/<uuid>/reset-password/, /api/auth/student/change-password/,
        # /api/auth/admins/<uuid>/reset-default-password/,
        # /api/auth/admin-password-reset/ — and any future one that follows
        # the same "password" naming convention.
        location ~ ^/api/auth/.*password {
            limit_req zone=sensitive_zone burst=3 nodelay;
            proxy_pass http://$auth_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── auth-service: all other /api/auth/* (standard rate limit) ─────────
        # 60 req/min — admin self-profile, CRUD, etc.
        location /api/auth/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$auth_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── user-service: /api/users/* ─────────────────────────────────────────
        location /api/users/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$user_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── resource-service: /api/resources/* ────────────────────────────────
        location /api/resources/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$resource_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── practice-service: /api/practice/* ─────────────────────────────────
        location /api/practice/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$practice_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── notification-service: /api/notifications/* ─────────────────────────
        location /api/notifications/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$notification_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── analytics-service: /api/analytics/* ───────────────────────────────
        location /api/analytics/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$analytics_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── assessment-service: export endpoints ──────────────────────────────
        # Matches .../results/export/, .../analytics/export/, and
        # .../dashboard/export/ — every admin export endpoint, regardless of
        # which module it belongs to. A regex location always takes
        # precedence over a plain-prefix location like /api/assessments/
        # below (nginx only falls back to the longest-prefix match when no
        # regex location matches), so this correctly overrides the general
        # api_zone rule for export URIs specifically.
        location ~ ^/api/assessments/admin/.*/export/$ {
            limit_req zone=export_zone burst=3 nodelay;
            proxy_pass http://$assessment_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── assessment-service: /api/assessments/* ────────────────────────────
        location /api/assessments/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$assessment_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── essay-service: autosave/submit/admin-bulk-action endpoints ────────
        # Task 15.2 — the three dedicated zones ADR 004 Section 4 decided
        # before these routes existed (see this file's own zone-definition
        # comment above), added now that they do. Regex locations always
        # take precedence over the plain-prefix /api/essay/ catch-all below
        # (nginx only falls back to longest-prefix when no regex matches),
        # mirroring assessment-service's own identical
        # ^/api/assessments/admin/.*/export/$ override immediately above.
        # The admin-bulk regex below also covers reports/bulk-download/ —
        # ADR 004 Section 4's own list names only retrigger/bulk-resend/
        # bulk-DLQ-retry, not bulk-download explicitly; included anyway
        # (found and deliberately kept, not silently added, during Phase
        # 15's own final-audit round) since it fits that same paragraph's
        # own stated rationale verbatim — "bulk admin actions are
        # inherently infrequent and expensive per call" — a bulk ZIP/PDF
        # report download is exactly that, and leaving it on the loose
        # 60r/m api_zone while its three siblings get a tight 10r/m one
        # would be an inconsistent, unexplained gap of its own.
        location ~ ^/api/essay/student/attempts/[^/]+/autosave/$ {
            limit_req zone=essay_autosave_zone burst=4000 nodelay;
            proxy_pass http://$essay_backend;
            include /etc/nginx/proxy_params.conf;
        }
        location ~ ^/api/essay/student/attempts/[^/]+/submit/$ {
            limit_req zone=essay_submit_zone burst=300 nodelay;
            proxy_pass http://$essay_backend;
            include /etc/nginx/proxy_params.conf;
        }
        location ~ ^/api/essay/admin/(submissions/[^/]+/retrigger|assignments/[^/]+/reports/bulk-(resend|download)|dlq/bulk-retry)/$ {
            limit_req zone=essay_admin_bulk_zone burst=3 nodelay;
            proxy_pass http://$essay_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── essay-service: /api/essay/* ────────────────────────────────────────
        location /api/essay/ {
            limit_req zone=api_zone burst=1000 nodelay;
            proxy_pass http://$essay_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Frontend is served by Vercel — no frontend proxy blocks needed ──────
    }
}
