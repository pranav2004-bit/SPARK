# Use Docker's embedded DNS resolver for dynamic upstream resolution
# This prevents 502 errors when upstream containers restart
resolver 127.0.0.11 valid=10s ipv6=off;

# Map $http_upgrade to set Connection header correctly
# Empty upgrade → close (regular HTTP); ws/websocket → upgrade (WebSocket/HMR)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server host.docker.internal:3000;
    keepalive 32;
}

# ── MinIO CORS proxy (port 9002) ─────────────────────────────────────────────
# Browser presigned-URL uploads go to localhost:9002, nginx proxies them to
# minio:9000 while injecting CORS headers.  The Host header is preserved so
# MinIO can still validate the SigV4 presigned-URL signature.
server {
    listen 9002;
    server_name _;
    client_max_body_size 500M;

    location / {
        # CORS headers on every response (including the 204 below)
        add_header 'Access-Control-Allow-Origin'   '*'    always;
        add_header 'Access-Control-Allow-Methods'  'GET, PUT, POST, DELETE, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'  '*'    always;
        add_header 'Access-Control-Expose-Headers' 'ETag' always;
        add_header 'Access-Control-Max-Age'        '3000' always;

        # Answer OPTIONS preflight without hitting MinIO
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Proxy everything else to MinIO
        # Variable forces dynamic DNS resolution via the resolver above,
        # preventing nginx from failing at startup if minio isn't ready yet.
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Preserve Host so presigned-URL SigV4 signature matches
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        # Strip MinIO's own CORS headers so nginx's add_header below doesn't duplicate them.
        # Duplicate Access-Control-Allow-Origin causes browsers to reject the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;
    }
}

# ── Main server ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # Backend API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Django admin
    location /django-admin/ {
        proxy_pass http://backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (Django)
    location /staticfiles/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend — everything else
    # map Connection header: pass upgrade for WebSocket (HMR), clear for regular requests
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
