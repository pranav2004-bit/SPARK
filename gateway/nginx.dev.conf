worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip compression (T10) ─────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;

    # ── Rate limiting zones (T9) ───────────────────────────────────────────────
    # auth endpoints: 10 req/min (login brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    # password reset/change endpoints: 5 req/min — stricter than login since
    # these are account-takeover / reset-spam vectors, not just credential
    # guessing. Kept the same in dev and prod (unlike auth_zone/api_zone
    # below) since there's no legitimate high-frequency dev workflow that
    # needs this loosened.
    limit_req_zone $binary_remote_addr zone=sensitive_zone:10m rate=5r/m;
    # all other API endpoints: 100 req/min
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/m;
    # assessment-service export endpoints specifically (Task 11.2's caching/
    # throughput review): results/analytics/dashboard CSV export are large,
    # infrequent, expensive requests (Task 7.3's export walks every
    # ResultSummary row for an assignment; analytics/dashboard export
    # recomputes aggregates) — a fundamentally different shape than the
    # frequent, cheap admin GETs (results-table pagination, dashboard
    # live-status polling) that share api_zone with them today. The concern
    # here isn't a human clicking "export" too often (100r/m already covers
    # that trivially) — it's a tight retry loop or scripted repeat-download
    # hammering the expensive code path specifically, without starving out
    # the same admin's other legitimate lightweight requests sharing
    # api_zone. 10r/m is generous for any real export workflow (an admin
    # pulling several assignments' data in a row) while meaningfully
    # capping a runaway loop.
    limit_req_zone $binary_remote_addr zone=export_zone:10m rate=10r/m;
    # frontend static assets: 500 req/min
    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=500r/m;
    limit_req_status 429;

    # ── Retry-After (matches the zone each URI actually falls into) ───────────
    # Dev rates: auth_zone=10r/m (6s/req), sensitive_zone=5r/m (12s/req),
    # export_zone=10r/m (6s/req), api_zone/static_zone are fast enough that
    # 1s is a safe minimum to advise.
    map $uri $retry_after {
        ~^/api/auth/(login|logout|token)/     "6";
        ~^/api/auth/.*password                "12";
        ~^/api/assessments/admin/.*/export/$  "6";
        default                               "1";
    }

    # ── Access logging ─────────────────────────────────────────────────────────
    # Suppress health/ready check noise from access logs
    map $request_uri $loggable {
        ~^/api/[^/]+/health/  0;
        ~^/api/[^/]+/ready/   0;
        default               1;
    }

    log_format json_access escape=json
        '{"time":"$time_iso8601",'
         '"method":"$request_method",'
         '"uri":"$request_uri",'
         '"status":$status,'
         '"body_bytes_sent":$body_bytes_sent,'
         '"request_time":$request_time,'
         '"remote_addr":"$remote_addr",'
         '"request_id":"$request_id",'
         '"upstream_addr":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json_access if=$loggable;

    # ── Docker DNS resolver ────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── WebSocket upgrade mapping (Next.js HMR in dev) ─────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ── Backend hostnames ──────────────────────────────────────────────────────
    # Deliberately NOT static `upstream{}` blocks. Open-source nginx resolves
    # an upstream{} block's server list once, at config load, and caches it
    # for the life of the worker process — if a backend container gets
    # recreated (new IP), nginx keeps sending traffic to the dead IP until
    # someone runs `nginx -s reload`, producing a 502 outage in the meantime.
    # Using a variable in proxy_pass instead forces nginx to re-resolve via
    # the `resolver` directive above on every request (bounded by its `valid`
    # TTL), so a recreated container is picked up automatically. Trade-off:
    # this loses upstream-block connection keepalive pooling — each request
    # gets a fresh TCP connection to the backend. Acceptable here: backends
    # are on the same low-latency Docker bridge network, not the public
    # internet, so the extra handshake cost is negligible next to correctness.
    map $host $auth_backend         { default auth-service:8000; }
    map $host $user_backend         { default user-service:8000; }
    map $host $resource_backend     { default resource-service:8000; }
    map $host $practice_backend     { default practice-service:8000; }
    map $host $notification_backend { default notification-service:8000; }
    map $host $analytics_backend    { default analytics-service:8000; }
    map $host $assessment_backend   { default assessment-service:8000; }
    map $host $frontend_backend     { default frontend:3000; }

    # MinIO CORS proxy (port 9002) removed 2026-09-10 — media storage now
    # points at real AWS S3, which has its own CORS support directly on the
    # bucket (see infra's setup notes) and a real, stable public endpoint
    # reachable from both the browser and this server, so the whole reason
    # this proxy existed (MinIO has neither) no longer applies. See
    # PRODUCTION_CHECKLIST.md's "Items Added During Development" for the
    # full migration record.

    # ── Main server (port 80) ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers on all responses
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;

        # Max upload size enforced at gateway (resource/practice presigned uploads)
        client_max_body_size 50M;

        # Custom 429 JSON body — overrides nginx default HTML error page.
        # Retry-After header now actually set (was previously only in the
        # JSON body, which HTTP clients/proxies don't parse automatically).
        error_page 429 @rate_limit_error;
        location @rate_limit_error {
            default_type application/json;
            add_header Retry-After $retry_after always;
            return 429 '{"error":"Rate limit exceeded","retry_after":"$retry_after"}';
        }

        # ── Health / ready probes — NO rate limiting ──────────────────────────
        # These are called by load balancers, Docker health checks, and monitoring
        # tools at high frequency. They must never be rate-limited.
        # More-specific prefix locations take precedence over the general blocks below.
        location /api/auth/health/          { proxy_pass http://$auth_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/auth/ready/           { proxy_pass http://$auth_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/users/health/         { proxy_pass http://$user_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/users/ready/          { proxy_pass http://$user_backend;         include /etc/nginx/proxy_params.conf; }
        location /api/resources/health/     { proxy_pass http://$resource_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/resources/ready/      { proxy_pass http://$resource_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/practice/health/      { proxy_pass http://$practice_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/practice/ready/       { proxy_pass http://$practice_backend;     include /etc/nginx/proxy_params.conf; }
        location /api/notifications/health/ { proxy_pass http://$notification_backend; include /etc/nginx/proxy_params.conf; }
        location /api/notifications/ready/  { proxy_pass http://$notification_backend; include /etc/nginx/proxy_params.conf; }
        location /api/analytics/health/     { proxy_pass http://$analytics_backend;    include /etc/nginx/proxy_params.conf; }
        location /api/analytics/ready/      { proxy_pass http://$analytics_backend;    include /etc/nginx/proxy_params.conf; }
        location /api/assessments/health/   { proxy_pass http://$assessment_backend;   include /etc/nginx/proxy_params.conf; }
        location /api/assessments/ready/    { proxy_pass http://$assessment_backend;   include /etc/nginx/proxy_params.conf; }

        # ── auth-service: block internal endpoints from external access ───────────
        # Internal paths are called directly on the Docker network (auth-service:8000)
        # and must never be reachable from outside.
        location /api/auth/internal/ {
            return 404;
        }

        # ── notification-service: block internal endpoints from external access ──
        location /api/notifications/internal/ {
            return 404;
        }

        # ── analytics-service: block internal endpoints from external access ─────
        location /api/analytics/internal/ {
            return 404;
        }

        # ── assessment-service: block internal endpoints from external access ────
        # No internal endpoints exist yet in V1 (docs/assessment-service-api.md,
        # Decision #6) — this block is reserved per the platform convention in
        # case a future phase adds one, starting as a blanket 404.
        location /api/assessments/internal/ {
            return 404;
        }

        # ── auth-service: login + token endpoints (tight rate limit) ─────────────
        # 10 req/min — brute-force protection for credential endpoints only.
        location /api/auth/login/           { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }
        location /api/auth/logout/          { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }
        location /api/auth/token/           { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://$auth_backend; include /etc/nginx/proxy_params.conf; }

        # ── auth-service: password reset/change endpoints (tightest rate limit) ──
        # 5 req/min — matches student/admin reset-password, change-password,
        # reset-default-password, admin-password-reset. Regex on "password"
        # in the path rather than enumerating each route: covers
        # /api/auth/me/change-password/, /api/auth/student/<id>/reset-password/,
        # /api/auth/admin/<uuid>/reset-password/, /api/auth/student/change-password/,
        # /api/auth/admins/<uuid>/reset-default-password/,
        # /api/auth/admin-password-reset/ — and any future one that follows
        # the same "password" naming convention. Must come before the general
        # /api/auth/ block below; nginx checks regex locations against the
        # remembered longest-prefix match and a matching regex always wins,
        # so ordering here doesn't actually change precedence — but it's kept
        # here for readability (specific-before-general).
        location ~ ^/api/auth/.*password {
            limit_req zone=sensitive_zone burst=3 nodelay;
            proxy_pass http://$auth_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── auth-service: all other /api/auth/* (standard rate limit) ─────────
        # 100 req/min — admin self-profile, CRUD, password change, etc.
        location /api/auth/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$auth_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── user-service: /api/users/* ─────────────────────────────────────────
        location /api/users/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$user_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── resource-service: /api/resources/* ────────────────────────────────
        location /api/resources/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$resource_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── practice-service: /api/practice/* ─────────────────────────────────
        location /api/practice/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$practice_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── notification-service: /api/notifications/* ─────────────────────────
        location /api/notifications/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$notification_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── analytics-service: /api/analytics/* ───────────────────────────────
        location /api/analytics/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$analytics_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── assessment-service: export endpoints (Task 11.2) ──────────────────
        # Matches .../results/export/, .../analytics/export/, and
        # .../dashboard/export/ — every admin export endpoint, regardless of
        # which module it belongs to. A regex location always takes
        # precedence over a plain-prefix location like /api/assessments/
        # below (nginx only falls back to the longest-prefix match when no
        # regex location matches), so this correctly overrides the general
        # api_zone rule for export URIs specifically — placed above the
        # catch-all here for readability, matching this file's existing
        # style, not because ordering affects which one wins.
        location ~ ^/api/assessments/admin/.*/export/$ {
            limit_req zone=export_zone burst=3 nodelay;
            proxy_pass http://$assessment_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── assessment-service: /api/assessments/* ────────────────────────────
        # Shares api_zone with every other service for now (100 req/min) —
        # per Task 1.4, a dedicated tighter zone for the exam-submit endpoint
        # specifically is only added if Phase 14 load testing shows it's
        # actually needed, not speculatively here.
        location /api/assessments/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://$assessment_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Next.js /_next/* — static chunks, HMR SSE stream, source maps ────────
        # No rate limiting — Turbopack loads 20+ chunks simultaneously on first paint.
        # proxy_buffering off — required for Turbopack SSE hot-reload stream to
        # forward events to the browser in real time (buffering causes ERR_CONNECTION_RESET).
        location /_next/ {
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;  # SSE connections are long-lived
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
        }

        # ── Next.js frontend: /* (catch-all) ──────────────────────────────────
        location / {
            limit_req zone=static_zone burst=50 nodelay;
            proxy_pass http://$frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_read_timeout 120s;  # Turbopack first-compile on slow WSL2 filesystem needs extra time
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }
    }
}
