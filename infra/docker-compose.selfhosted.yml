# ═══════════════════════════════════════════════════════════════════════════
# SELF-HOSTED OVERRIDE — local rehearsal for the VPS migration
# ═══════════════════════════════════════════════════════════════════════════
# Adds a local Postgres + SeaweedFS (S3-compatible, actively maintained —
# MinIO's Community Edition stopped shipping Docker images in 2026 and is in
# maintenance mode, so it was not used here) so the stack runs fully
# self-hosted, with ZERO dependency on real AWS RDS/S3 — safe to experiment
# with freely, since it never touches the shared production
# database/bucket that infra/docker-compose.dev.yml normally points at.
#
# Usage (run from the infra/ directory):
#   docker-compose -f docker-compose.dev.yml -f docker-compose.selfhosted.yml up -d --build
#
# This is an OVERRIDE layer — docker-compose.dev.yml must be given first as
# the base. It does NOT modify docker-compose.dev.yml or pgbouncer.ini, so
# plain `docker-compose -f docker-compose.dev.yml up` (no override) keeps
# working exactly as before, still pointed at real AWS RDS/S3, completely
# unaffected by this file's existence.

services:

  # Local, fully self-hosted Postgres — replaces real AWS RDS for this
  # override only. Reuses the existing init-db.sql (already defines all 8
  # databases + least-privilege per-service users, identical credentials to
  # what docker-compose.dev.yml's services already expect).
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: postgres
    volumes:
      - selfhosted_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - spark-internal

  # Re-point pgbouncer at the new local postgres instead of real RDS, using
  # a dedicated local-only ini file (pgbouncer.ini itself, which still
  # points at RDS, is untouched).
  pgbouncer:
    volumes:
      - ./pgbouncer/pgbouncer.local.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Self-hosted, S3-compatible media storage — replaces real AWS S3 for this
  # override only. SeaweedFS (Apache 2.0, actively maintained, official
  # Docker Hub image) runs master+volume+filer+S3-gateway in one process via
  # `weed server -s3`. s3-config.json defines one static credential pair
  # (full test workload, no per-bucket scoping — fine for local rehearsal;
  # the real VPS deploy should scope this down to one bucket's worth of
  # actions before going live).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: always
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.config=/etc/seaweedfs/s3-config.json"]
    volumes:
      - selfhosted_seaweedfs_data:/data
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # Master UI (http://localhost:9333) — dev convenience only
    networks:
      - spark-internal

  # One-shot: creates the media bucket. Retries until the S3 gateway is
  # actually accepting requests (weed server's own startup has no bundled
  # healthcheck tool to depend on). Uses the official AWS CLI image — no
  # SeaweedFS-specific client needed, since it's a real S3 API.
  seaweedfs-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: spark_media_access_key
      AWS_SECRET_ACCESS_KEY: spark_media_secret_key_dev_2024
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do echo 'waiting for seaweedfs...'; sleep 2; done &&
      (aws --endpoint-url http://seaweedfs:8333 s3 mb s3://spark-app-media-2026 || true) &&
      echo 'Bucket ready.'
      "
    networks:
      - spark-internal

  # ── The 4 services that actually talk to S3/SeaweedFS ──────────────────────
  # Only these keys are overridden — every other env var (SECRET_KEY, DB_*,
  # CLAMAV_*, etc.) still comes from docker-compose.dev.yml underneath.
  # AWS_S3_CDN_DOMAIN is blanked out: the bucket isn't configured public-read
  # here, so media delivery falls back to the app's own presigned URLs
  # (generate_presigned_upload_url / the equivalent download path), which
  # don't need public bucket access — same mechanism the real app already
  # uses for uploads regardless of storage backend.

  resource-service:
    environment:
      AWS_ACCESS_KEY_ID: spark_media_access_key
      AWS_SECRET_ACCESS_KEY: spark_media_secret_key_dev_2024
      AWS_DEFAULT_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_S3_CDN_DOMAIN: ""
    depends_on:
      seaweedfs:
        condition: service_started

  resource-worker:
    environment:
      AWS_ACCESS_KEY_ID: spark_media_access_key
      AWS_SECRET_ACCESS_KEY: spark_media_secret_key_dev_2024
      AWS_DEFAULT_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_S3_CDN_DOMAIN: ""
    depends_on:
      seaweedfs:
        condition: service_started

  practice-service:
    environment:
      AWS_ACCESS_KEY_ID: spark_media_access_key
      AWS_SECRET_ACCESS_KEY: spark_media_secret_key_dev_2024
      AWS_DEFAULT_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_S3_CDN_DOMAIN: ""
    depends_on:
      seaweedfs:
        condition: service_started

  assessment-service:
    environment:
      AWS_ACCESS_KEY_ID: spark_media_access_key
      AWS_SECRET_ACCESS_KEY: spark_media_secret_key_dev_2024
      AWS_DEFAULT_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_S3_CDN_DOMAIN: ""
    depends_on:
      seaweedfs:
        condition: service_started

volumes:
  selfhosted_postgres_data:
  selfhosted_seaweedfs_data:
