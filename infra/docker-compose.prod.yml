# SPARK — Production environment
# Usage: infra/scripts/start-prod.sh
# All secrets must be provided via per-service .env files — see .env.example in each service directory.
# Run validate-env.sh before deploying to verify all required variables are set.

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  # Local postgres/init-db.sql removed 2026-09-12 — database now points at
  # real AWS RDS (instance spark-primary-db), matching the same migration
  # already done for infra/docker-compose.dev.yml and for media storage
  # (S3). pgbouncer.ini (shared between dev and prod) already points at
  # RDS — this block was the only thing in this file still assuming a
  # local, self-hosted Postgres. See PRODUCTION_CHECKLIST.md's "Items
  # Added During Development" for the full migration record.

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-internal

  clamav:
    # clamav/clamav:stable (Alpine-based) publishes amd64 only. Debian-based
    # clamav-debian is the same official ClamAV image, multi-arch (amd64 +
    # arm64), needed for arm64/Graviton EC2 instances.
    image: clamav/clamav-debian:stable
    restart: always
    # Caps clamd's memory footprint so it can't consume enough to
    # starve/kill sibling containers on the host. mem_limit is the classic
    # Compose key — applies under plain `docker compose up`, unlike
    # `deploy.resources.limits` (swarm-only).
    # Raised from 1.5g (2026-09-15) after reproducing a real hang in dev:
    # 1.5g covers clamd's normal steady-state footprint but not a live
    # freshclam database reload, which briefly holds the OLD signature set
    # in memory while validating and loading the NEW one before the atomic
    # swap — 1.5g left no headroom for that spike, so the container sat
    # pinned at ~99.8% memory indefinitely (thrashing, not cleanly
    # OOM-killed) and never finished loading, failing its healthcheck
    # indefinitely. This isn't dev-specific — freshclam's daily reload runs
    # in production too, on the same image with the same limit, so it would
    # eventually hit this here as well. 3g gives real margin above the
    # reload spike; the EC2 instance sizing (m6g.xlarge, 16GB) already
    # budgeted for ClamAV's footprint with comfortable headroom to spare.
    # Production hosts need at least ~3GB free for this alone — see
    # PRODUCTION_CHECKLIST.md.
    mem_limit: 3000m
    mem_reservation: 1500m
    environment:
      # Video/audio uploads go up to 500MB — clamd's INSTREAM defaults (25MB)
      # would reject them outright. Raise the ceiling to match.
      CLAMD_CONF_StreamMaxLength: "550M"
      CLAMD_CONF_MaxFileSize: "550M"
      CLAMD_CONF_MaxScanSize: "600M"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - spark-internal

  pgbouncer:
    # Every service's own .env.example already documents DB_HOST=pgbouncer
    # (confirmed: services/auth-service/.env.example,
    # services/assessment-service/.env.example, etc.) — CONN_MAX_AGE=0
    # (Section 2 of PRODUCTION_CHECKLIST.md) is only correct with a real
    # connection pooler in front of Postgres. This container was missing
    # entirely from this file, meaning production `.env` files pointed
    # every service at a pgbouncer that never existed here — found and
    # fixed during Phase 15 documentation/production-readiness pass.
    image: edoburu/pgbouncer:latest
    restart: always
    # DB_HOST/DB_PORT below are unused — pgbouncer.ini (mounted, points at
    # real RDS with its own per-database host/port/credentials) takes
    # precedence over these.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - spark-internal

  # ── Services ─────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/auth-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/auth-service/.env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/user-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/user-service/.env
    environment:
      # Pinned explicitly rather than left to inherit core/settings.py's
      # code default: that default was tightened (5s/3 retries → 3s/2) on
      # 2026-08-17 for the dev Docker-internal network, where a stale
      # connection after long idle should fail fast. Real production
      # network hops have more legitimate variance than same-host dev
      # traffic, so this service keeps the original, more patient values
      # rather than silently inheriting the dev-motivated tightening.
      AUTH_SERVICE_TIMEOUT: "5"
      AUTH_SERVICE_RETRIES: "3"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/users/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  outbox-worker:
    # user-service's own dead-letter outbox worker (PRODUCTION_CHECKLIST.md
    # Section 12) — was missing from this file entirely, alongside
    # pgbouncer/db-backup; found and fixed during Phase 15's
    # production-readiness documentation pass. A student deleted from
    # user-service with no running outbox-worker to clean up their
    # auth-service account is exactly the security gap Section 12
    # describes — this container is not optional.
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/user-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/user-service/.env
    environment:
      # Worker handles its own retry loop — auth_client should NOT also
      # retry internally, or a transient failure causes two separate
      # retry chains (matches infra/docker-compose.dev.yml's outbox-worker).
      AUTH_SERVICE_TIMEOUT: "10"
      AUTH_SERVICE_RETRIES: "1"
      AUTH_SERVICE_RETRY_BACKOFF: "0"
      OUTBOX_POLL_INTERVAL: "30"
    entrypoint: ["python", "-u", "manage.py", "run_outbox_worker"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      user-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - spark-internal

  # cleanup_outbox's own docstring says "Safe to schedule as a nightly cron
  # job" — it was fully built and tested but nothing actually scheduled it
  # (found during a production-readiness audit, 2026-09-08), so DONE outbox
  # events would accumulate in the table forever. Same image as
  # outbox-worker (matches infra/docker-compose.dev.yml's outbox-cleanup) —
  # deliberately its own container, not folded into run_outbox_worker's
  # loop, since that loop's whole design is fast 30s event-delivery polling,
  # a different concern from once-a-day housekeeping. Runs once immediately
  # on start (catches a bad deploy right away) then once every 24h. Only
  # depends on pgbouncer + user-service — unlike outbox-worker it never
  # calls auth-service, so it has no dependency on it.
  outbox-cleanup:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/user-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/user-service/.env
    entrypoint: ["sh", "-c", "while true; do python manage.py cleanup_outbox; sleep 86400; done"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - spark-internal

  resource-service:
    build:
      context: ../services/resource-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/resource-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/resource-service/.env
    environment:
      # No AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY here (2026-09-12) —
      # production runs on an EC2 instance with role spark-backend-ec2-role
      # attached; boto3 picks up credentials from the instance itself. Only
      # non-secret bucket/region config is set directly here, same as
      # docker-compose.dev.yml (which does pass explicit keys, since dev has
      # no instance role to fall back on).
      AWS_DEFAULT_REGION: ap-south-2
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_CDN_DOMAIN: spark-app-media-2026.s3.ap-south-2.amazonaws.com
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/resources/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  resource-worker:
    build:
      context: ../services/resource-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/resource-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/resource-service/.env
    environment:
      # Same reasoning as resource-service above.
      AWS_DEFAULT_REGION: ap-south-2
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_CDN_DOMAIN: spark-app-media-2026.s3.ap-south-2.amazonaws.com
    entrypoint: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4", "-Q", "resource-service"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      # NOT service_healthy — see infra/docker-compose.dev.yml for why.
      clamav:
        condition: service_started
    networks:
      - spark-internal

  practice-service:
    build:
      context: ../services/practice-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/practice-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/practice-service/.env
    environment:
      # Same reasoning as resource-service's block — see its comment.
      AWS_DEFAULT_REGION: ap-south-2
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_CDN_DOMAIN: spark-app-media-2026.s3.ap-south-2.amazonaws.com
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      # NOT service_healthy — see infra/docker-compose.dev.yml for why.
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/practice/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/notification-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/notification-service/.env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/notifications/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  notification-worker:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/notification-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/notification-service/.env
    entrypoint: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4", "-Q", "notification-service"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-internal

  notification-beat:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/notification-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/notification-service/.env
    entrypoint: ["celery", "-A", "core", "beat", "--loglevel=info",
                 "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-internal

  analytics-service:
    build:
      context: ../services/analytics-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/analytics-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/analytics-service/.env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/analytics/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  analytics-worker:
    build:
      context: ../services/analytics-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/analytics-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/analytics-service/.env
    entrypoint: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4", "-Q", "analytics-service"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-internal

  analytics-beat:
    build:
      context: ../services/analytics-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/analytics-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/analytics-service/.env
    entrypoint: ["celery", "-A", "core", "beat", "--loglevel=info",
                 "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-internal

  assessment-service:
    build:
      context: ../services/assessment-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/assessment-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/assessment-service/.env
    environment:
      # Same reasoning as user-service's override above — pin the original,
      # more patient values here rather than silently inherit the
      # dev-motivated 2026-08-17 tightening (AUTH_SERVICE_TIMEOUT 5s→2s/3→2
      # retries, USER_SERVICE_TIMEOUT 5s→3s/3→2 retries), which was aimed at
      # a same-host Docker network staleness bug, not real prod latency.
      AUTH_SERVICE_TIMEOUT: "5"
      AUTH_SERVICE_RETRIES: "3"
      USER_SERVICE_TIMEOUT: "5"
      USER_SERVICE_RETRIES: "3"
      # Same reasoning as resource-service's block — see its comment.
      AWS_DEFAULT_REGION: ap-south-2
      AWS_STORAGE_BUCKET_NAME: spark-app-media-2026
      AWS_S3_CDN_DOMAIN: spark-app-media-2026.s3.ap-south-2.amazonaws.com
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      # NOT service_healthy — see infra/docker-compose.dev.yml for why
      # (scanning happens synchronously in this service's own API process;
      # it must still be able to start and serve non-image-upload traffic
      # even if ClamAV is slow to come up or briefly unavailable).
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/assessments/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - spark-internal

  assessment-worker:
    build:
      context: ../services/assessment-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/assessment-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/assessment-service/.env
    entrypoint: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4", "-Q", "assessment-service"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-internal

  assessment-beat:
    build:
      context: ../services/assessment-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/assessment-service:${GIT_SHA:-latest}
    restart: always
    env_file: ../services/assessment-service/.env
    # The auto-submit/auto-close sweep (ADR 001, Task 4.1) — must run in
    # prod exactly as it does in dev; a missing beat container here would
    # silently mean sessions past their deadline are never auto-finalized.
    entrypoint: ["celery", "-A", "core", "beat", "--loglevel=info",
                 "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spark-internal

  # Local db-backup (cron pg_dump of the local postgres container) removed
  # 2026-09-12 — real AWS RDS provides its own automated backups natively
  # (14-day retention, configured directly on the instance), which now
  # protect the real data instead, matching the same treatment already
  # applied to infra/docker-compose.dev.yml. See PRODUCTION_CHECKLIST.md's
  # "Items Added During Development" for the full migration record.

  # ── Nginx gateway ─────────────────────────────────────────────────────────────
  # Frontend is deployed on Vercel — nginx serves API routes only.

  nginx:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: ${REGISTRY:-spark}/nginx:${GIT_SHA:-latest}
    restart: always
    # Port 9002 (MinIO CORS proxy) removed 2026-09-11 alongside the rest of
    # that workaround — real S3 has its own native bucket-level CORS, so
    # nginx no longer listens on 9002 internally (see gateway/nginx.conf's
    # own removal note). This mapping was stale, exposing a port nothing
    # was listening on.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Standard certbot host paths, bind-mounted straight through so the
      # host's `certbot` CLI and this container always see the same files —
      # no relative-path indirection to get wrong. /etc/letsencrypt holds
      # the issued cert/key; /var/www/certbot is where certbot's webroot
      # plugin drops the HTTP-01 challenge file for Let's Encrypt to fetch
      # (initial issuance AND every renewal, no nginx downtime either time).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      practice-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/api/auth/health/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - spark-internal

volumes:
  redis_data:
  clamav_data:

networks:
  spark-internal:
    driver: bridge
