[databases]
auth_db         = host=postgres port=5432 dbname=auth_db user=auth_db_user password=auth_dev_password_2024
user_db         = host=postgres port=5432 dbname=user_db user=user_db_user password=user_dev_password_2024
resource_db     = host=postgres port=5432 dbname=resource_db user=resource_db_user password=resource_dev_password_2024
practice_db     = host=postgres port=5432 dbname=practice_db user=practice_db_user password=practice_dev_password_2024
notification_db = host=postgres port=5432 dbname=notification_db user=notification_db_user password=notification_dev_password_2024
analytics_db    = host=postgres port=5432 dbname=analytics_db user=analytics_db_user password=analytics_dev_password_2024
assessment_db   = host=postgres port=5432 dbname=assessment_db user=assessment_db_user password=assessment_dev_password_2024

[pgbouncer]
listen_addr     = 0.0.0.0
listen_port     = 5432

; Transaction mode: connections released after each transaction.
; Django services must use CONN_MAX_AGE=0 with this mode.
pool_mode       = transaction

; Each service gets up to 100 concurrent client connections. NOTE: this was
; sized as "100 x 6 services" before assessment-service existed — now stale
; arithmetic at 7 services. Left unchanged for now (capacity math and the
; decision on whether to raise it live in docs/adr/001-assessment-timer-architecture.md,
; Task 1.2 addendum); Task 14.1's load test provides the real numbers this
; ceiling should ultimately be tuned against, not a guess made here.
max_client_conn = 600

; 10 real server connections per database pool (7 dbs × 10 = 70 max real connections).
default_pool_size = 10

; Allow one extra connection per pool for admin queries.
reserve_pool_size = 2
reserve_pool_timeout = 5

; Idle connection timeouts.
server_idle_timeout  = 600
client_idle_timeout  = 60

; Authentication: md5 (matches POSTGRES_HOST_AUTH_METHOD in docker-compose).
auth_type        = md5
auth_file        = /etc/pgbouncer/userlist.txt

; Logging.
log_connections  = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin access.
admin_users      = postgres
stats_users      = postgres
