essay_db        = host=spark-primary-db.c5y2w486ef6p.ap-south-2.rds.amazonaws.com port=5432 dbname=essay_db user=essay_db_user password=essay_dev_password_2024

[pgbouncer]
listen_addr     = 0.0.0.0
listen_port     = 5432

; RDS is reached over the public internet now (not a Docker-internal
; hostname), so the upstream connection must be encrypted.
server_tls_sslmode = require

; Transaction mode: connections released after each transaction.
; Django services must use CONN_MAX_AGE=0 with this mode.
pool_mode       = transaction

; Originally sized as "100 x 6 services" before assessment-service existed —
; already loose intent, not a hard per-service reservation, since PgBouncer
; enforces one global ceiling here, not a per-database one.
;
; Task 16.2 re-check (real numbers, not the provisional placeholder ADR 004
; Section 1 left behind): all 8 services now run the same
; `--workers ${UVICORN_WORKERS:-3}` gunicorn/UvicornWorker entrypoint
; (confirmed live across every service's entrypoint.sh), so the platform
; runs 8 x 3 = 24 application worker *processes* today. Each process holds a
; PgBouncer client slot only for the duration of a single DB transaction
; (pool_mode=transaction, CONN_MAX_AGE=0), not for its whole lifetime, so
; 600 is not "24 processes vs 600 slots" — the real ceiling that matters is
; simultaneous in-flight DB-touching requests, which this project cannot
; precisely model without a real load test (Uvicorn's async workers can run
; many concurrent sync-view threads per process via Django's ASGI thread
; pool). What Task 16.2 CAN confirm without guessing: 600 gives at minimum
; 25 simultaneous in-flight DB transactions per service if spread evenly
; across all 8 (600 / 8 = 75, well above the 24-process floor), so there is
; no evidence this ceiling is already exceeded at rest, the way the stale
; "70 real connections" comment below was silently wrong. This is not a
; final validation — Task 18.1's real load test is still the actual word on
; whether 600 holds up under genuine 2,000-concurrent-student traffic.
max_client_conn = 600

; 10 real server connections per database pool (8 dbs × 10 = 80 max real
; connections — updated for essay_db, Task 16.2's real re-check; was still
; saying "7 dbs x 10 = 70" here even after essay_db's pool was added above,
; the exact stale-comment pattern this file's own max_client_conn comment
; already warns about).
default_pool_size = 10

; Allow one extra connection per pool for admin queries.
reserve_pool_size = 2
reserve_pool_timeout = 5

; Idle connection timeouts.
server_idle_timeout  = 600
client_idle_timeout  = 60

; Authentication: md5 (matches POSTGRES_HOST_AUTH_METHOD in docker-compose).
auth_type        = md5
auth_file        = /etc/pgbouncer/userlist.txt

; Logging.
log_connections  = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin access.
admin_users      = postgres
stats_users      = postgres
