# LOCAL / SELF-HOSTED variant of pgbouncer.ini — points at the local
# `postgres` container (Docker-internal network) instead of real AWS RDS.
# Used only when the infra/docker-compose.selfhosted.yml override is applied
# (local staging rehearsal for the VPS migration, or the VPS itself). The
# original pgbouncer.ini (RDS-pointing) is untouched and still used by
# plain `infra/docker-compose.dev.yml` / `infra/docker-compose.prod.yml` on
# their own, so this file introduces zero risk to the real AWS-backed
# environments.

[databases]
auth_db         = host=postgres port=5432 dbname=auth_db user=auth_db_user password=auth_dev_password_2024
user_db         = host=postgres port=5432 dbname=user_db user=user_db_user password=user_dev_password_2024
resource_db     = host=postgres port=5432 dbname=resource_db user=resource_db_user password=resource_dev_password_2024
practice_db     = host=postgres port=5432 dbname=practice_db user=practice_db_user password=practice_dev_password_2024
notification_db = host=postgres port=5432 dbname=notification_db user=notification_db_user password=notification_dev_password_2024
analytics_db    = host=postgres port=5432 dbname=analytics_db user=analytics_db_user password=analytics_dev_password_2024
assessment_db   = host=postgres port=5432 dbname=assessment_db user=assessment_db_user password=assessment_dev_password_2024
essay_db        = host=postgres port=5432 dbname=essay_db user=essay_db_user password=essay_dev_password_2024

[pgbouncer]
listen_addr     = 0.0.0.0
listen_port     = 5432

; Local Docker-internal network — no TLS needed between pgbouncer and the
; local postgres container (unlike the real pgbouncer.ini, which reaches
; RDS over the public internet and requires server_tls_sslmode=require).
server_tls_sslmode = disable

pool_mode       = transaction
max_client_conn = 600
default_pool_size = 10
reserve_pool_size = 2
reserve_pool_timeout = 5

server_idle_timeout  = 600
client_idle_timeout  = 60

auth_type        = md5
auth_file        = /etc/pgbouncer/userlist.txt

log_connections  = 0
log_disconnections = 0
log_pooler_errors = 1

admin_users      = postgres
stats_users      = postgres
